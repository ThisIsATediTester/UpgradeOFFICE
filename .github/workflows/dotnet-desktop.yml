name: Build UpgradeOFFICE

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore UpgradeOFFICE.Desktop/UpgradeOFFICE.Desktop.csproj

      - name: Build desktop app
        run: dotnet build UpgradeOFFICE.Desktop/UpgradeOFFICE.Desktop.csproj --no-restore --configuration ${{ matrix.configuration }}
